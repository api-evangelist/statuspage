# ---------------------------------------------------------------------------
# Filter types
# ---------------------------------------------------------------------------

"""Filters for listing pages."""
input PageFilter {
  name: String
  subdomain: String
}

"""Filters for listing incidents."""
input IncidentFilter {
  status: [String!]
  impact: [String!]
  limit: Int
  offset: Int
  includePostmortem: Boolean
}

"""Filters for listing components."""
input ComponentFilter {
  status: [ComponentStatus!]
  groupId: ID
  showcase: Boolean
}

"""Filters for listing subscribers."""
input SubscriberFilter {
  type: SubscriberType
  email: String
  limit: Int
  offset: Int
}

# ---------------------------------------------------------------------------
# Root types
# ---------------------------------------------------------------------------

type Query {
  """List all pages accessible with the current API key."""
  pages(filter: PageFilter): [Page!]!

  """Retrieve a single page by ID."""
  page(id: ID!): Page

  """Get the aggregated status for a page (public v2)."""
  pageStatus(pageId: ID!): PageStatus

  """Get detailed page configuration."""
  pageDetails(pageId: ID!): PageDetails

  """Get notification settings for a page."""
  pageNotifications(pageId: ID!): PageNotifications

  """List all components for a page."""
  components(pageId: ID!, filter: ComponentFilter): [Component!]!

  """Get a single component."""
  component(pageId: ID!, componentId: ID!): Component

  """List component groups for a page."""
  componentGroups(pageId: ID!): [ComponentGroup!]!

  """Get a single component group."""
  componentGroup(pageId: ID!, groupId: ID!): ComponentGroup

  """List all components including group nesting."""
  groupedComponents(pageId: ID!): [GroupedComponent!]!

  """List incidents for a page."""
  incidents(pageId: ID!, filter: IncidentFilter): [Incident!]!

  """Get a single incident."""
  incident(pageId: ID!, incidentId: ID!): Incident

  """List unresolved incidents."""
  unresolvedIncidents(pageId: ID!): [RealTimeIncident!]!

  """List all scheduled maintenances."""
  scheduledMaintenances(pageId: ID!): [ScheduledIncident!]!

  """List active scheduled maintenances."""
  activeMaintenances(pageId: ID!): [ScheduledIncident!]!

  """List upcoming scheduled maintenances."""
  upcomingMaintenances(pageId: ID!): [ScheduledIncident!]!

  """Get updates for an incident."""
  incidentUpdates(pageId: ID!, incidentId: ID!): [IncidentUpdate!]!

  """List subscribers for a page."""
  subscribers(pageId: ID!, filter: SubscriberFilter): [Subscriber!]!

  """Get a single subscriber."""
  subscriber(pageId: ID!, subscriberId: ID!): Subscriber

  """List metrics for a page."""
  metrics(pageId: ID!): [Metric!]!

  """Get a single metric."""
  metric(pageId: ID!, metricId: ID!): Metric

  """Get metric data points."""
  metricData(pageId: ID!, metricId: ID!, from: DateTime, to: DateTime): MetricData

  """Get metric history rollups."""
  metricHistory(pageId: ID!, metricId: ID!): MetricHistory

  """List incident templates for a page."""
  templates(pageId: ID!): [Template!]!

  """Get a single template."""
  template(pageId: ID!, templateId: ID!): Template

  """Get the current organization."""
  organization: Organization

  """Get the status embed widget configuration."""
  statusEmbedded(pageId: ID!): StatusEmbedded

  """List all API keys for the authenticated user."""
  apiKeys: [APIKey!]!
}

type Mutation {
  """Update page settings."""
  updatePage(pageId: ID!, input: PageInput!): Page

  """Create a new component on a page."""
  createComponent(pageId: ID!, input: ComponentInput!): Component

  """Update an existing component."""
  updateComponent(pageId: ID!, componentId: ID!, input: ComponentInput!): Component

  """Delete a component."""
  deleteComponent(pageId: ID!, componentId: ID!): Boolean

  """Create a component group."""
  createComponentGroup(pageId: ID!, input: ComponentGroupInput!): ComponentGroup

  """Update a component group."""
  updateComponentGroup(pageId: ID!, groupId: ID!, input: ComponentGroupInput!): ComponentGroup

  """Delete a component group."""
  deleteComponentGroup(pageId: ID!, groupId: ID!): Boolean

  """Create a new incident."""
  createIncident(pageId: ID!, input: IncidentInput!): Incident

  """Update an existing incident."""
  updateIncident(pageId: ID!, incidentId: ID!, input: IncidentInput!): Incident

  """Delete an incident."""
  deleteIncident(pageId: ID!, incidentId: ID!): Boolean

  """Post a status update to an incident."""
  postIncidentUpdate(pageId: ID!, incidentId: ID!, input: IncidentUpdateInput!): IncidentUpdate

  """Create a scheduled maintenance."""
  createMaintenance(pageId: ID!, input: MaintenanceInput!): ScheduledIncident

  """Update a scheduled maintenance."""
  updateMaintenance(pageId: ID!, maintenanceId: ID!, input: MaintenanceInput!): ScheduledIncident

  """Delete a scheduled maintenance."""
  deleteMaintenance(pageId: ID!, maintenanceId: ID!): Boolean

  """Create a new subscriber."""
  createSubscriber(pageId: ID!, input: SubscriberInput!): Subscriber

  """Update subscriber component subscriptions."""
  updateSubscriberComponents(pageId: ID!, subscriberId: ID!, componentIds: [ID!]!): Subscriber

  """Unsubscribe (delete) a subscriber."""
  deleteSubscriber(pageId: ID!, subscriberId: ID!): Boolean

  """Resend confirmation to an unconfirmed subscriber."""
  resendSubscriberConfirmation(pageId: ID!, subscriberId: ID!): Boolean

  """Create a new metric."""
  createMetric(pageId: ID!, input: MetricInput!): Metric

  """Update a metric."""
  updateMetric(pageId: ID!, metricId: ID!, input: MetricInput!): Metric

  """Delete a metric."""
  deleteMetric(pageId: ID!, metricId: ID!): Boolean

  """Submit data points to a metric."""
  submitMetricData(pageId: ID!, metricId: ID!, data: [MetricDataPointInput!]!): MetricData

  """Reset metric data (delete all points)."""
  resetMetricData(pageId: ID!, metricId: ID!): Boolean

  """Create an incident template."""
  createTemplate(pageId: ID!, input: TemplateInput!): Template

  """Update an incident template."""
  updateTemplate(pageId: ID!, templateId: ID!, input: TemplateInput!): Template

  """Delete an incident template."""
  deleteTemplate(pageId: ID!, templateId: ID!): Boolean

  """Create a new API key."""
  createApiKey(name: String!, pageId: ID): APIKey

  """Revoke an API key."""
  revokeApiKey(keyId: ID!): Boolean
}
