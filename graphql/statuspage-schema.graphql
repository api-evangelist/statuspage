# ---------------------------------------------------------------------------
# Metric types
# ---------------------------------------------------------------------------

"""A metric chart displayed on a status page."""
type Metric {
  id: ID!
  pageId: ID!
  name: String!
  displayChartOnLanding: Boolean!
  mostRecentDataDegradedAt: DateTime
  mostRecentDataAt: DateTime
  startDate: Date
  created: DateTime!
  updated: DateTime!
  lastFetchedAt: DateTime
  backfillPercentage: Float
  tokenType: String
  provider: MetricProvider!
  units: String
  decimals: Int
  suffix: String
  displayType: String
  data: MetricData
  history: MetricHistory
}

"""Detailed configuration for a metric, including provider settings."""
type MetricDetails {
  metricId: ID!
  pageId: ID!
  name: String!
  provider: MetricProvider!
  units: String
  decimals: Int
  suffix: String
  displayType: String
  displayChartOnLanding: Boolean!
  tokenType: String
  startDate: Date
  created: DateTime!
  updated: DateTime!
}

"""A single data point value for a metric."""
type MetricValue {
  timestamp: DateTime!
  value: Float!
}

"""Aggregated historical metric values."""
type MetricData {
  metricId: ID!
  data: [MetricValue!]!
  from: DateTime
  to: DateTime
}

"""Historical rollup of metric values by period."""
type MetricHistory {
  metricId: ID!
