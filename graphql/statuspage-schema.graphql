  updatedAt: DateTime!
}

"""New Relic-sourced metric configuration."""
type NewRelicMetric implements MetricSource {
  id: ID!
  metricId: ID!
  provider: MetricProvider!
  newRelicApiKey: String
  newRelicAccountId: String
  newRelicQuery: String
  createdAt: DateTime!
  updatedAt: DateTime!
}

"""Pingdom-sourced metric configuration."""
type PingdomMetric implements MetricSource {
  id: ID!
  metricId: ID!
  provider: MetricProvider!
  pingdomApiKey: String
  pingdomCheckId: String
  createdAt: DateTime!
  updatedAt: DateTime!
}

"""PagerDuty-sourced metric configuration."""
type PagerDutyMetric implements MetricSource {
  id: ID!
  metricId: ID!
  provider: MetricProvider!
  pagerdutyApiKey: String
  pagerdutyServiceId: String
  createdAt: DateTime!
  updatedAt: DateTime!
}

