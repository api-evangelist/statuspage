"""
Atlassian Statuspage GraphQL Schema
Derived from the Statuspage REST API (https://developer.statuspage.io/)
and the public Status API v2 (https://doers.statuspage.io/api/v2/).
"""

# ---------------------------------------------------------------------------
# Scalars
# ---------------------------------------------------------------------------

scalar DateTime
scalar Date
scalar JSON
scalar URL

# ---------------------------------------------------------------------------
# Enums
# ---------------------------------------------------------------------------

"""Current operational status of a component."""
enum ComponentStatus {
  operational
  degraded_performance
  partial_outage
  major_outage
  under_maintenance
}

"""Status values for an unplanned (real-time) incident."""
enum IncidentStatus {
  investigating
  identified
  monitoring
  resolved
  postmortem
}

"""Status values for a scheduled maintenance incident."""
enum MaintenanceStatus {
  scheduled
  in_progress
  verifying
  completed
}

"""High-level classification of an incident."""
enum IncidentType {
  realtime
  scheduled
  backfill
}

"""Delivery channel for a page subscriber."""
enum SubscriberType {
  email
  sms
  webhook
  atlassian
  slack
  rss
  atom
}

"""Upstream data source for a metric."""
enum MetricProvider {
  Self
  Datadog
  NewRelic
  Pingdom
  PagerDuty
}

"""Aggregation function applied to metric data."""
enum MetricAggregation {
  sum
  average
  count
}

"""Impact level of an incident on a component."""
enum ComponentImpact {
  operational
  degraded_performance
  partial_outage
  major_outage
}

"""Visibility of a status page or incident."""
enum Visibility {
  public
  private
}

# ---------------------------------------------------------------------------
# Interfaces
# ---------------------------------------------------------------------------

"""Base fields shared by all subscriber types."""
interface Subscriber {
  id: ID!
  type: SubscriberType!
  pageId: ID!
  createdAt: DateTime!
  subscribedToComponents: [Component!]
  purgeAt: DateTime
  isUnconfirmed: Boolean!
}

"""Fields shared by all metric provider configurations."""
interface MetricSource {
  id: ID!
  metricId: ID!
  provider: MetricProvider!
  createdAt: DateTime!
  updatedAt: DateTime!
}

"""Fields shared by every incident variant."""
interface BaseIncident {
  id: ID!
  name: String!
  status: String!
  type: IncidentType!
  pageId: ID!
  shortlink: URL
  incidentUpdates: [IncidentUpdate!]!
  components: [Component!]
  createdAt: DateTime!
  updatedAt: DateTime!
  resolvedAt: DateTime
}

# ---------------------------------------------------------------------------
# Page types
# ---------------------------------------------------------------------------

"""Top-level container representing a Statuspage site."""
type Page {
  id: ID!
  name: String!
  pageDescription: String
  subdomain: String!
  domain: String
  url: URL!
  branding: String
  cssBodyBackgroundColor: String
  cssFontColor: String
  cssLightFontColor: String
  cssGreens: String
  cssYellows: String
  cssOranges: String
  cssBlues: String
  cssReds: String
  cssBorderColor: String
  cssGraphColor: String
  cssLinkColor: String
  cssNoData: String
  hiddenFromSearch: Boolean!
  allowPageSubscriptions: Boolean!
  allowIncidentSubscriptions: Boolean!
  allowEmailSubscriptions: Boolean!
  allowSmsSubscriptions: Boolean!
  allowRssAtomFeeds: Boolean!
  allowWebhookSubscriptions: Boolean!
  notificationsFromEmail: String
  notificationsEmailFooter: String
  activityScore: Int
  twitterUsername: String
  viewersMustBeTeamMembers: Boolean!
  ipRestrictions: String
  city: String
  state: String
  country: String
  timeZone: String!
  cssCodeEmbed: String
  createdAt: DateTime!
  updatedAt: DateTime!
  components: [Component!]
  incidents: [Incident!]
  maintenances: [ScheduledIncident!]
  subscribers: [Subscriber!]
  metrics: [Metric!]
  templates: [Template!]
  status: PageStatus
  details: PageDetails
}

"""Detailed configuration and statistics for a page."""
type PageDetails {
  pageId: ID!
  subscriberCount: Int
  dailySubscriberCount: Int
  subscribersRequireAuthentication: Boolean
  transactionCount: Int
  pageAccessGroupCount: Int
  teamCount: Int
  userCount: Int
  metricCount: Int
  componentCount: Int
  incidentCount: Int
}

"""Aggregated status summary for a page, as returned by the public v2 API."""
type PageStatus {
  indicator: String!
  description: String!
}

"""Notification settings attached to a page."""
type PageNotifications {
  pageId: ID!
  allowEmailSubscriptions: Boolean!
  allowSmsSubscriptions: Boolean!
  allowWebhookSubscriptions: Boolean!
  allowRssAtomFeeds: Boolean!
  allowSlackSubscriptions: Boolean!
  allowAtlassianSubscriptions: Boolean!
  notificationsFromEmail: String
  notificationsEmailFooter: String
  emailNotificationsEnabled: Boolean!
  smsNotificationsEnabled: Boolean!
}

"""Summary listing of components for a page."""
type PageComponents {
  pageId: ID!
  components: [Component!]!
  groups: [ComponentGroup!]!
}

# ---------------------------------------------------------------------------
# Component types
# ---------------------------------------------------------------------------

"""A tracked service or system displayed on a status page."""
type Component {
  id: ID!
  pageId: ID!
  groupId: ID
  group: ComponentGroup
  name: String!
  description: String
  position: Int!
  status: ComponentStatus!
  showcase: Boolean!
  onlyShowIfDegradedOnDependents: Boolean!
  startDate: Date
  createdAt: DateTime!
  updatedAt: DateTime!
  automation: Boolean
  automationEmail: String
  subcomponents: [Component!]
}

"""Extended metadata for a component, including raw API payload fields."""
type ComponentDetails {
  componentId: ID!
  pageId: ID!
  name: String!
  description: String
  status: ComponentStatus!
  automationEmail: String
  startDate: Date
  groupId: ID
  showcase: Boolean!
  onlyShowIfDegradedOnDependents: Boolean!
  position: Int!
  createdAt: DateTime!
  updatedAt: DateTime!
}

"""Union type surfacing the current status of a component with history."""
type ComponentStatus {
  id: ID!
  name: String!
  current: ComponentStatus!
  previousStatus: ComponentStatus
  changedAt: DateTime
}

"""A logical grouping of components."""
type ComponentGroup {
  id: ID!
  pageId: ID!
  name: String!
  description: String
  position: Int!
  components: [Component!]!
  createdAt: DateTime!
  updatedAt: DateTime!
}

"""A component nested inside a component group, with group context."""
type GroupedComponent {
  component: Component!
  group: ComponentGroup!
  position: Int!
}

# ---------------------------------------------------------------------------
# Incident types
# ---------------------------------------------------------------------------

"""Abstract incident — use concrete types via inline fragments."""
type Incident implements BaseIncident {
  id: ID!
  name: String!
  status: String!
  type: IncidentType!
  pageId: ID!
  shortlink: URL
  impact: String
  impactOverride: String
  monitoringAt: DateTime
  resolvedAt: DateTime
  autoTransitionDeliverNotificationsAtEnd: Boolean
  autoTransitionDeliverNotificationsAtStart: Boolean
  autoTransitionToMaintenanceState: Boolean
  autoTransitionToOperationalState: Boolean
  sendNotifications: Boolean
  scheduledFor: DateTime
  scheduledUntil: DateTime
  scheduledRemindPrior: Boolean
  scheduledAutoInProgress: Boolean
  scheduledAutoCompleted: Boolean
  metadata: JSON
  postmortemPublishedAt: DateTime
  postmortemNotifiedSubscribers: Boolean
  postmortemNotifiedTwitter: Boolean
  postmortemIgnore: Boolean
  incidentUpdates: [IncidentUpdate!]!
  components: [Component!]
  createdAt: DateTime!
  updatedAt: DateTime!
}

"""Detailed view of an incident including all API-returned fields."""
type IncidentDetails {
  incidentId: ID!
  pageId: ID!
  name: String!
  status: String!
  type: IncidentType!
  impact: String
  shortlink: URL
  incidentUpdates: [IncidentUpdateDetails!]!
  components: [ComponentDetails!]
  createdAt: DateTime!
  updatedAt: DateTime!
  resolvedAt: DateTime
  monitoringAt: DateTime
  scheduledFor: DateTime
  scheduledUntil: DateTime
}

"""Status of an incident at a point in time."""
type IncidentStatus {
  incidentId: ID!
  status: String!
  setAt: DateTime!
  setBy: String
}

"""Typed indicator of whether an incident is realtime, scheduled, or backfill."""
type IncidentType {
  name: String!
  label: String!
}

"""An unplanned service disruption incident."""
type RealTimeIncident implements BaseIncident {
  id: ID!
  name: String!
  status: IncidentStatus!
  type: IncidentType!
  pageId: ID!
  shortlink: URL
  impact: String
  impactOverride: String
  monitoringAt: DateTime
  resolvedAt: DateTime
  sendNotifications: Boolean!
  metadata: JSON
  postmortemPublishedAt: DateTime
  incidentUpdates: [IncidentUpdate!]!
  components: [Component!]
  affectedComponentStatus: ComponentImpact
  createdAt: DateTime!
  updatedAt: DateTime!
}

"""A planned maintenance window incident."""
type ScheduledIncident implements BaseIncident {
  id: ID!
  name: String!
  status: MaintenanceStatus!
  type: IncidentType!
  pageId: ID!
  shortlink: URL
  scheduledFor: DateTime!
  scheduledUntil: DateTime!
  scheduledRemindPrior: Boolean!
  scheduledAutoInProgress: Boolean!
  scheduledAutoCompleted: Boolean!
  autoTransitionDeliverNotificationsAtEnd: Boolean!
  autoTransitionDeliverNotificationsAtStart: Boolean!
  autoTransitionToMaintenanceState: Boolean!
  autoTransitionToOperationalState: Boolean!
  sendNotifications: Boolean!
  incidentUpdates: [IncidentUpdate!]!
  components: [Component!]
  createdAt: DateTime!
  updatedAt: DateTime!
  resolvedAt: DateTime
}

"""A retroactively entered historical incident."""
type BackfillIncident implements BaseIncident {
  id: ID!
  name: String!
  status: String!
  type: IncidentType!
  pageId: ID!
  shortlink: URL
  backfilledAt: DateTime!
  startedAt: DateTime!
  endedAt: DateTime!
  incidentUpdates: [IncidentUpdate!]!
  components: [Component!]
  createdAt: DateTime!
  updatedAt: DateTime!
  resolvedAt: DateTime
}

"""A status message update posted to an incident."""
type IncidentUpdate {
  id: ID!
  incidentId: ID!
  status: String!
  body: String!
  createdAt: DateTime!
  updatedAt: DateTime!
  displayAt: DateTime
  deliverNotifications: Boolean!
  customTweet: String
  tweetId: String
  affectedComponents: [ComponentImpact!]
  wantsTwitterUpdate: Boolean!
}

"""Detailed view of a single incident update message."""
type IncidentUpdateDetails {
  updateId: ID!
  incidentId: ID!
  pageId: ID!
  status: String!
  body: String!
  displayAt: DateTime
  deliverNotifications: Boolean!
  createdAt: DateTime!
  updatedAt: DateTime!
  affectedComponents: [JSON]
}

