- aid: statuspage:webhooks
  name: Statuspage Webhook Notifications
  description: >-
    Outbound webhook notifications Statuspage POSTs to subscriber endpoints for component status changes,
    incident lifecycle updates, and scheduled maintenance lifecycle updates. Subscribers must respond
    with a 2xx status code within 30 seconds.
  humanURL: https://support.atlassian.com/statuspage/docs/enable-webhook-notifications/
