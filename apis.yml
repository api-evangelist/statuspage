aid: statuspage
name: Statuspage
description: Statuspage by Atlassian is a hosted status page and incident communication
  platform that helps companies communicate real-time service status, incident updates,
  scheduled maintenance, and component health to customers and internal stakeholders.
  It supports public and private pages, audience-specific pages, subscriber notifications
  via email, SMS, webhooks, Slack, and Teams, and 150+ third-party component integrations.
  The Statuspage REST API provides programmatic access to pages, components, incidents,
  maintenances, metrics, subscribers, and users authenticated with an OAuth-prefixed
  API key.
