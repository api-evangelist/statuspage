openapi: 3.1.0
info:
  title: Statuspage REST API
  version: "1.0.0"
  description: |
    Atlassian Statuspage REST API for managing pages, components, incidents,
    scheduled maintenances, metrics, and subscribers. Endpoints derived from
    https://developer.statuspage.io/. Each API token is limited to 1 request
    per second on a 60-second rolling window.
  contact:
    name: Statuspage Support
    url: https://support.atlassian.com/statuspage/
servers:
  - url: https://api.statuspage.io/v1
    description: Statuspage REST API
security:
  - ApiKey: []
components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: Authorization
      description: |
        Pass `Authorization: OAuth <api_key>`. The API key may alternatively
        be provided via the `api_key` query parameter.
paths:
  /pages:
    get:
      summary: List pages
      responses:
        "200":
          description: List of pages
  /pages/{page_id}:
    parameters:
      - in: path
        name: page_id
        required: true
        schema: { type: string }
    get:
      summary: Get a page
      responses:
        "200":
          description: Page
    patch:
      summary: Update a page
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: Updated page
  /pages/{page_id}/components:
    parameters:
      - in: path
        name: page_id
        required: true
        schema: { type: string }
    get:
      summary: List components on a page
      responses:
        "200":
          description: List of components
    post:
      summary: Create a component
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "201":
          description: Component created
  /pages/{page_id}/components/{component_id}:
    parameters:
      - in: path
        name: page_id
        required: true
        schema: { type: string }
      - in: path
        name: component_id
        required: true
        schema: { type: string }
    get:
      summary: Get a component
      responses:
        "200":
          description: Component
    patch:
      summary: Update a component
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: Updated component
    delete:
      summary: Delete a component
      responses:
        "204":
          description: Deleted
  /pages/{page_id}/component-groups:
    parameters:
      - in: path
        name: page_id
        required: true
        schema: { type: string }
    get:
      summary: List component groups
      responses:
        "200":
          description: List of component groups
    post:
      summary: Create a component group
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "201":
          description: Component group created
  /pages/{page_id}/incidents:
    parameters:
      - in: path
        name: page_id
        required: true
        schema: { type: string }
    get:
      summary: List incidents
      responses:
        "200":
          description: List of incidents
    post:
      summary: Create an incident
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "201":
          description: Incident created
  /pages/{page_id}/incidents/{incident_id}:
    parameters:
      - in: path
        name: page_id
        required: true
        schema: { type: string }
      - in: path
        name: incident_id
        required: true
        schema: { type: string }
    get:
      summary: Get an incident
      responses:
        "200":
          description: Incident
    patch:
      summary: Update an incident
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: Updated incident
    delete:
      summary: Delete an incident
      responses:
        "204":
          description: Deleted
  /pages/{page_id}/incidents/unresolved:
    parameters:
      - in: path
        name: page_id
        required: true
        schema: { type: string }
    get:
      summary: List unresolved incidents
      responses:
        "200":
          description: List of unresolved incidents
  /pages/{page_id}/incidents/scheduled:
    parameters:
      - in: path
        name: page_id
        required: true
        schema: { type: string }
    get:
      summary: List scheduled incidents
      responses:
        "200":
          description: List of scheduled incidents
  /pages/{page_id}/incidents/{incident_id}/incident_updates/{incident_update_id}:
    parameters:
      - in: path
        name: page_id
        required: true
        schema: { type: string }
      - in: path
        name: incident_id
        required: true
        schema: { type: string }
      - in: path
        name: incident_update_id
        required: true
        schema: { type: string }
    patch:
      summary: Update an incident update
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: Updated incident update
  /pages/{page_id}/maintenances:
