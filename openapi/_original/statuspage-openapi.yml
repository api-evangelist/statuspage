            schema: { type: object }
      responses:
        "201":
          description: Subscriber created
  /pages/{page_id}/subscribers/{subscriber_id}:
    parameters:
      - in: path
        name: page_id
        required: true
        schema: { type: string }
      - in: path
        name: subscriber_id
        required: true
        schema: { type: string }
    get:
      summary: Get a subscriber
      responses:
        "200":
          description: Subscriber
    patch:
      summary: Update a subscriber
      requestBody:
        required: true
