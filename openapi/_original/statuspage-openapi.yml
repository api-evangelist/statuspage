        "200":
          description: Updated subscriber
    delete:
      summary: Delete a subscriber
      responses:
        "204":
          description: Deleted
  /pages/{page_id}/metrics:
    parameters:
      - in: path
        name: page_id
        required: true
        schema: { type: string }
    get:
      summary: List metrics
      responses:
        "200":
          description: List of metrics
    post:
