          description: Metric created
  /pages/{page_id}/metrics/{metric_id}/data:
    parameters:
      - in: path
        name: page_id
        required: true
        schema: { type: string }
      - in: path
        name: metric_id
        required: true
        schema: { type: string }
    post:
      summary: Add metric data points
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "201":
          description: Data submitted
