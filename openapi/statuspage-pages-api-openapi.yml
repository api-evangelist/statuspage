openapi: 3.2.0
info:
  title: Statuspage REST Pages API
  version: 1.0.0
  description: 'Atlassian Statuspage REST API for managing pages, components, incidents,

    scheduled maintenances, metrics, and subscribers. Endpoints derived from

    https://developer.statuspage.io/. Each API token is limited to 1 request

    per second on a 60-second rolling window.'
  contact:
    name: Statuspage Support
    url: https://support.atlassian.com/statuspage/
servers:
- url: https://api.statuspage.io/v1
  description: Statuspage REST API
security:
- ApiKey: []
tags:
- name: Pages
paths:
  /pages:
    get:
      summary: List pages
      responses:
        '200':
          description: List of pages
      tags:
      - Pages
      operationId: getPages
      x-operation-id-source: derived
  /pages/{page_id}:
    parameters:
    - in: path
      name: page_id
      required: true
      schema:
        type: string
    get:
      summary: Get a page
      responses:
        '200':
          description: Page
      tags:
      - Pages
      operationId: getPagesByPageId
      x-operation-id-source: derived
    patch:
      summary: Update a page
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Updated page
      tags:
      - Pages
      operationId: patchPagesByPageId
      x-operation-id-source: derived
  /pages/{page_id}/components:
    parameters:
    - in: path
      name: page_id
      required: true
      schema:
        type: string
    get:
      summary: List components on a page
      responses:
        '200':
          description: List of components
      tags:
      - Pages
      operationId: getPagesByPageIdComponents
      x-operation-id-source: derived
    post:
      summary: Create a component
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Component created
      tags:
      - Pages
      operationId: postPagesByPageIdComponents
      x-operation-id-source: derived
  /pages/{page_id}/components/{component_id}:
    parameters:
    - in: path
      name: page_id
      required: true
      schema:
        type: string
    - in: path
      name: component_id
      required: true
      schema:
        type: string
    get:
      summary: Get a component
      responses:
        '200':
          description: Component
      tags:
      - Pages
      operationId: getPagesByPageIdComponentsByComponentId
      x-operation-id-source: derived
    patch:
      summary: Update a component
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Updated component
      tags:
      - Pages
      operationId: patchPagesByPageIdComponentsByComponentId
      x-operation-id-source: derived
    delete:
      summary: Delete a component
      responses:
        '204':
          description: Deleted
      tags:
      - Pages
      operationId: deletePagesByPageIdComponentsByComponentId
      x-operation-id-source: derived
  /pages/{page_id}/component-groups:
    parameters:
    - in: path
      name: page_id
      required: true
      schema:
        type: string
    get:
      summary: List component groups
      responses:
        '200':
          description: List of component groups
      tags:
      - Pages
      operationId: getPagesByPageIdComponentGroups
      x-operation-id-source: derived
    post:
      summary: Create a component group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Component group created
      tags:
      - Pages
      operationId: postPagesByPageIdComponentGroups
      x-operation-id-source: derived
  /pages/{page_id}/incidents:
    parameters:
    - in: path
      name: page_id
      required: true
      schema:
        type: string
    get:
      summary: List incidents
      responses:
        '200':
          description: List of incidents
      tags:
