      name: page_id
      required: true
      schema:
        type: string
    - in: path
      name: incident_id
      required: true
      schema:
        type: string
    get:
      summary: Get an incident
      responses:
        '200':
          description: Incident
      tags:
      - Pages
      operationId: getPagesByPageIdIncidentsByIncidentId
      x-operation-id-source: derived
    patch:
      summary: Update an incident
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Updated incident
      tags:
      - Pages
      operationId: patchPagesByPageIdIncidentsByIncidentId
      x-operation-id-source: derived
    delete:
