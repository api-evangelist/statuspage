        type: string
    - in: path
      name: incident_update_id
      required: true
      schema:
        type: string
    patch:
      summary: Update an incident update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Updated incident update
      tags:
      - Pages
      operationId: patchPagesByPageIdIncidentsByIncidentIdIncidentUpdatesByIncidentUpdateId
      x-operation-id-source: derived
  /pages/{page_id}/maintenances:
    parameters:
